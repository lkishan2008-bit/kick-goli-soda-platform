<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kick Goli Soda — Heritage Meets Fizz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-black text-emerald-400 tracking-wider">KICK</span>
        <span class="text-xs uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full">Goli Soda</span>
      </div>
      
      <div class="flex items-center gap-4">
        <span class="text-xs text-zinc-400 hidden sm:inline">Status: <span id="db-status" class="text-emerald-400 font-mono">● Supabase Active</span></span>
        
        <!-- Cart Trigger Button -->
        <button id="cart-toggle-btn" class="relative bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500 hover:text-zinc-950 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition">
          🛒 Cart
          <span id="cart-count-badge" class="bg-emerald-400 text-zinc-950 font-black text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-12 text-center max-w-3xl mx-auto px-4">
    <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
      Pop the Marble. <br/><span class="text-emerald-400">Feel the Kick.</span>
    </h1>
    <p class="text-zinc-400 text-lg">
      Authentic Indian street soda upgraded with bold fusion flavors and premium fizz.
    </p>
  </section>

  <!-- Catalog Section -->
  <main class="max-w-6xl mx-auto px-4 pb-20 flex-1 w-full">
    
    <!-- Category Filter Controls -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 border-b border-zinc-800 pb-4">
      <div class="flex flex-wrap gap-2" id="category-filters">
        <button onclick="filterFlavors('All')" class="filter-btn bg-emerald-500 text-zinc-950 font-bold px-4 py-1.5 rounded-full text-xs transition">All</button>
        <button onclick="filterFlavors('CLASSIC HERITAGE')" class="filter-btn bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white font-semibold px-4 py-1.5 rounded-full text-xs transition">Classic Heritage</button>
        <button onclick="filterFlavors('SPICY & HERBAL')" class="filter-btn bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white font-semibold px-4 py-1.5 rounded-full text-xs transition">Spicy & Herbal</button>
        <button onclick="filterFlavors('FUSION FIZZ')" class="filter-btn bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white font-semibold px-4 py-1.5 rounded-full text-xs transition">Fusion Fizz</button>
      </div>
      <div id="status-indicator" class="text-xs text-zinc-500 font-mono">Loading menu...</div>
    </div>

    <!-- Product Grid -->
    <div id="flavor-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 animate-pulse h-48"></div>
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 animate-pulse h-48"></div>
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 animate-pulse h-48"></div>
    </div>
  </main>

  <!-- Slide-out Cart Drawer -->
  <div id="cart-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity"></div>
  
  <aside id="cart-drawer" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-zinc-900 border-l border-zinc-800 z-50 transform translate-x-full transition-transform duration-300 flex flex-col justify-between">
    <!-- Drawer Header -->
    <div class="p-6 border-b border-zinc-800 flex justify-between items-center">
      <h3 class="text-xl font-bold flex items-center gap-2">
        Your Order
        <span id="cart-drawer-count" class="text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full">0 items</span>
      </h3>
      <button id="cart-close-btn" class="text-zinc-400 hover:text-white text-2xl font-bold px-2">&times;</button>
    </div>

    <!-- Cart Item List -->
    <div id="cart-items-container" class="p-6 flex-1 overflow-y-auto divide-y divide-zinc-800">
      <p class="text-zinc-500 text-center py-12">Your cart is empty. Pick a soda!</p>
    </div>

    <!-- Drawer Footer -->
    <div class="p-6 border-t border-zinc-800 bg-zinc-950/50 space-y-4">
      <div class="space-y-1 text-sm">
        <div class="flex justify-between text-zinc-400">
          <span>Subtotal</span>
          <span id="cart-subtotal">₹0</span>
        </div>
        <div class="flex justify-between text-zinc-400">
          <span>Taxes & Bottling Fee</span>
          <span id="cart-taxes">₹0</span>
        </div>
        <div class="flex justify-between text-lg font-bold text-white pt-2 border-t border-zinc-800">
          <span>Total</span>
          <span id="cart-total" class="text-emerald-400">₹0</span>
        </div>
      </div>
      <button id="checkout-btn" disabled class="w-full bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-emerald-400 text-zinc-950 font-bold py-3 rounded-xl transition">
        Proceed to Checkout
      </button>
    </div>
  </aside>

  <!-- Application Script -->
  <script>
    const SUPABASE_URL = 'https://ukkhhhmjblzyuazumqpt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_u0xqV1xW9zPwzWtqGn86_Q_TA0_FNrn';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Global App State
    let cart = [];
    let menuFlavors = [];
    let activeCategory = 'All';

    // UI Element References
    const cartToggleBtn = document.getElementById('cart-toggle-btn');
    const cartCloseBtn = document.getElementById('cart-close-btn');
    const cartOverlay = document.getElementById('cart-overlay');
    const cartDrawer = document.getElementById('cart-drawer');
    const cartItemsContainer = document.getElementById('cart-items-container');
    const cartCountBadge = document.getElementById('cart-count-badge');
    const cartDrawerCount = document.getElementById('cart-drawer-count');
    const cartSubtotal = document.getElementById('cart-subtotal');
    const cartTaxes = document.getElementById('cart-taxes');
    const cartTotal = document.getElementById('cart-total');
    const checkoutBtn = document.getElementById('checkout-btn');

    // Cart Drawer Handlers
    function toggleCart(open) {
      if (open) {
        cartOverlay.classList.remove('hidden');
        cartDrawer.classList.remove('translate-x-full');
      } else {
        cartOverlay.classList.add('hidden');
        cartDrawer.classList.add('translate-x-full');
      }
    }

    cartToggleBtn.addEventListener('click', () => toggleCart(true));
    cartCloseBtn.addEventListener('click', () => toggleCart(false));
    cartOverlay.addEventListener('click', () => toggleCart(false));

    // Category Filter Handler
    function filterFlavors(category) {
      activeCategory = category;
      
      // Update Filter Button Styles
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        if (btn.textContent.toUpperCase() === category || (category === 'All' && btn.textContent === 'All')) {
          btn.className = 'filter-btn bg-emerald-500 text-zinc-950 font-bold px-4 py-1.5 rounded-full text-xs transition';
        } else {
          btn.className = 'filter-btn bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white font-semibold px-4 py-1.5 rounded-full text-xs transition';
        }
      });

      renderFlavors();
    }

    // Render Product Grid based on Filter
    function renderFlavors() {
      const grid = document.getElementById('flavor-grid');
      const status = document.getElementById('status-indicator');

      const filtered = activeCategory === 'All' 
        ? menuFlavors 
        : menuFlavors.filter(f => f.category.toUpperCase() === activeCategory);

      status.textContent = `${filtered.length} items shown`;

      if (filtered.length === 0) {
        grid.innerHTML = `<p class="text-zinc-400 col-span-full py-8 text-center">No flavors found in this category.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="bg-zinc-900 border border-zinc-800 hover:border-emerald-500/50 transition duration-300 rounded-xl p-6 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded">${item.category}</span>
              ${item.badge ? `<span class="text-xs font-bold text-zinc-300 bg-zinc-800 px-2 py-0.5 rounded">${item.badge}</span>` : ''}
            </div>
            <h3 class="text-xl font-bold mb-1">${item.name}</h3>
            <p class="text-zinc-400 text-sm mb-4">${item.description || ''}</p>
          </div>
          <div class="flex justify-between items-center pt-4 border-t border-zinc-800/60">
            <span class="text-2xl font-black text-white">₹${item.price}</span>
            <button onclick="addToCart(${item.id})" class="bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-1">
              + Add to Order
            </button>
          </div>
        </div>
      `).join('');
    }

    // Add to Cart Logic
    function addToCart(flavorId) {
      const item = menuFlavors.find(f => f.id === flavorId);
      if (!item) return;

      const existingIndex = cart.findIndex(c => c.id === flavorId);
      if (existingIndex > -1) {
        cart[existingIndex].quantity += 1;
      } else {
        cart.push({ ...item, quantity: 1 });
      }

      updateCartUI();
      toggleCart(true);
    }

    function updateQuantity(flavorId, change) {
      const index = cart.findIndex(c => c.id === flavorId);
      if (index === -1) return;

      cart[index].quantity += change;
      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }

      updateCartUI();
    }

    // Render & Recalculate Cart UI
    function updateCartUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const taxes = subtotal > 0 ? Math.round(subtotal * 0.05) : 0; // 5% GST
      const grandTotal = subtotal + taxes;

      cartCountBadge.textContent = totalCount;
      cartDrawerCount.textContent = `${totalCount} item${totalCount === 1 ? '' : 's'}`;
      
      cartSubtotal.textContent = `₹${subtotal}`;
      cartTaxes.textContent = `₹${taxes}`;
      cartTotal.textContent = `₹${grandTotal}`;

      checkoutBtn.disabled = cart.length === 0;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<p class="text-zinc-500 text-center py-12">Your cart is empty. Pick a soda!</p>`;
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="py-4 flex justify-between items-center gap-4">
          <div class="flex-1">
            <h4 class="font-bold text-white text-sm">${item.name}</h4>
            <p class="text-xs text-zinc-400">₹${item.price} each</p>
          </div>
          <div class="flex items-center gap-2 bg-zinc-800 rounded-lg px-2 py-1 border border-zinc-700">
            <button onclick="updateQuantity(${item.id}, -1)" class="text-zinc-400 hover:text-white text-base font-bold w-5 h-5 flex items-center justify-center">-</button>
            <span class="text-xs font-bold text-white px-1">${item.quantity}</span>
            <button onclick="updateQuantity(${item.id}, 1)" class="text-zinc-400 hover:text-white text-base font-bold w-5 h-5 flex items-center justify-center">+</button>
          </div>
          <span class="font-bold text-sm text-emerald-400">₹${item.price * item.quantity}</span>
        </div>
      `).join('');
    }

    // Fetch Menu Data from Supabase
    async function fetchFlavors() {
      const status = document.getElementById('status-indicator');

      try {
        const { data, error } = await supabaseClient
          .from('flavors')
          .select('*');

        if (error) throw error;

        menuFlavors = data || [];
        renderFlavors();

      } catch (err) {
        console.error('Database connection error:', err);
        status.textContent = 'Connection Error';
        document.getElementById('flavor-grid').innerHTML = `
          <div class="col-span-full bg-red-500/10 border border-red-500/30 rounded-xl p-6 text-center">
            <p class="text-red-400 font-semibold mb-2">Failed to load flavors from database.</p>
            <p class="text-xs text-zinc-400 font-mono">${err.message || 'Check console for details.'}</p>
          </div>
        `;
      }
    }

    fetchFlavors();
  </script>
</body>
</html>

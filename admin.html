<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kick Goli Soda — Admin Dashboard</title>
  <!-- Third-Party Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex flex-col">

  <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-black text-emerald-400 tracking-wider">KICK</span>
        <span class="text-xs uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-bold">Admin Panel</span>
      </div>
      <button onclick="fetchOrders()" class="bg-zinc-800 hover:bg-zinc-700 text-xs font-bold px-3 py-1.5 rounded-lg border border-zinc-700 transition flex items-center gap-1">
        🔄 Refresh Live Orders
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-black">Live Order Management</h1>
        <p class="text-xs text-zinc-400">Track and manage customer requests in real-time.</p>
      </div>
      <div id="order-count" class="text-xs font-mono bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg text-emerald-400">
        Loading orders...
      </div>
    </div>

    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-zinc-950 text-zinc-400 uppercase text-[10px] tracking-wider border-b border-zinc-800">
            <tr>
              <th class="p-4">ID / Time</th>
              <th class="p-4">Customer Details</th>
              <th class="p-4">Items Ordered</th>
              <th class="p-4">Total</th>
              <th class="p-4">Status</th>
              <th class="p-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="orders-table-body" class="divide-y divide-zinc-800/60">
            <tr>
              <td colspan="6" class="text-center py-12 text-zinc-500">Fetching live orders...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- External Admin JS -->
  <script src="admin.js"></script>
</body>
</html>

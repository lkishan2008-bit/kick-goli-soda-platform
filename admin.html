<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Kick Goli Soda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="bg-emerald-500 text-zinc-950 font-black px-2.5 py-1 rounded-lg text-sm tracking-wider">KICK</span>
        <h1 class="text-lg font-bold text-white">Live Orders Dashboard</h1>
      </div>
      <button onclick="fetchAdminOrders()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-bold px-3 py-2 rounded-lg border border-zinc-700 transition flex items-center gap-2">
        🔄 Refresh Live
      </button>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
    
    <!-- Stats Banner -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl">
        <p class="text-xs text-zinc-400 font-semibold mb-1">Total Orders</p>
        <p id="stat-total" class="text-3xl font-black text-white">0</p>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl">
        <p class="text-xs text-amber-400 font-semibold mb-1">Pending Orders</p>
        <p id="stat-pending" class="text-3xl font-black text-amber-400">0</p>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl">
        <p class="text-xs text-emerald-400 font-semibold mb-1">Total Revenue</p>
        <p id="stat-revenue" class="text-3xl font-black text-emerald-400">₹0</p>
      </div>
    </div>

    <!-- Orders Table Container -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden">
      <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
        <h2 class="text-sm font-bold text-zinc-300">Incoming Customer Orders</h2>
        <span id="admin-status" class="text-xs text-zinc-500">Loading orders...</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-zinc-300">
          <thead class="bg-zinc-950/60 text-xs text-zinc-400 uppercase tracking-wider border-b border-zinc-800">
            <tr>
              <th class="px-4 py-3">ID</th>
              <th class="px-4 py-3">Customer</th>
              <th class="px-4 py-3">Phone</th>
              <th class="px-4 py-3">UTR / Txn ID</th>
              <th class="px-4 py-3">Items Ordered</th>
              <th class="px-4 py-3">Total</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="orders-tbody" class="divide-y divide-zinc-800/60">
            <tr>
              <td colspan="8" class="text-center py-8 text-zinc-500">Fetching live orders...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
